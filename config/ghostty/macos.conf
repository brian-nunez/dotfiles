# Shared Omarchy-derived settings load first; these preferences apply to both Macs.
language = en
config-file = themes/monokai-sublimetext.conf
font-size = 28
cursor-style = block
# Keep the shared no-cursor,ssh-env integration and extended-key bindings.
term = xterm-256color
macos-titlebar-style = tabs
window-width = 100000
window-height = 100000
window-padding-x = 10
window-padding-y = 10
# GTK-only setting retained from the original config; ignored on macOS.
gtk-titlebar = false
# Borderless windows disable native macOS tabs, regardless of titlebar style.
window-decoration = none
confirm-close-surface = false
copy-on-select = clipboard
mouse-shift-capture = false
